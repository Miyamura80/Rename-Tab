[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.6.0"
hooks = [
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "fmt", name = "Biome format", entry = "bunx biome check --write", language = "system", pass_filenames = false, always_run = true },
]
